# The Linux client: the Windows client's twin (windows-release.yml), VibeSkua
# (the Avalonia UI) with each tab's game in Ruffle's desktop player, packed as
# a portable tar.gz and an AppImage in a draft Gitea release. Run by hand (Run workflow), or by
# pushing a tag linux-v<version> (e.g. linux-v1.8.5-test1), which is then the
# release's tag.
#
# Built on Debian 12: a Linux program runs where glibc is at least as new as
# the newest glibc function it uses. Debian 12 has glibc 2.36, but the player
# only asks for 2.34 or older, and the build fails if that ever passes 2.35
# (Ubuntu 22.04), so this covers Ubuntu 22.04, Debian 12, Fedora 35, Mint 21
# and later. (Debian 11 has reached its end of life.)
#
# - Ruffle: the same commit as the Windows client (docker/ruffle-windows.ref,
#   branch windows-skua on this Gitea). Fontconfig is opened at run time
#   (fontconfig-dlopen), FreeType is left out (one library fewer that could
#   differ between distributions), and TLS is rustls with its own root certificates
#   (OpenSSL's library is libssl.so.1.1 on some distributions and .so.3 on
#   others, so a player linked to one fails on the rest). The player links
#   only to glibc, ALSA and libudev, and opens Vulkan, OpenGL and X11 itself.
# - Skua: Skua.App.Avalonia published self-contained for linux-x64, so no .NET
#   install is needed. The bundled player (ruffle/ruffle_desktop) is what makes
#   it the desktop client rather than the Docker build (SkuaRuntime.DesktopClient).
# - The archive: the app as VibeSkua and VibeSkua Manager (a copy, which opens
#   the Manager by its name), skua.swf beside it, the player in ruffle/, and a
#   script that adds both to the applications menu.
# - The AppImage: the same folder as one file to download and run
#   (docs/linux-AppRun.sh starts it; "--manager", or "Manager" in the file's
#   name, opens the Manager). Its runtime needs no libfuse2, which Ubuntu 22.04
#   and later do not install.

name: Linux release

on:
  push:
    tags: ["linux-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.8.5). Blank = <Version> in Directory.Build.props"
        required: false
        default: ""
      draft:
        description: "Create as draft"
        required: false
        default: "true"

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  linux:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -eu
          V="${{ inputs.version }}"
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "version=${GITHUB_REF_NAME#linux-v}" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "Releasing $GITHUB_REF_NAME"
            exit 0
          fi
          if [ -z "$V" ]; then
            V=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1 | tr -d '[:space:]')
          fi
          if [ -z "$V" ]; then echo "could not resolve a version"; exit 1; fi
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=linux-v$V-$SHA" >> "$GITHUB_OUTPUT"
          echo "Releasing linux-v$V-$SHA"

      - name: Install toolchains
        run: |
          set -eu
          apt-get update
          # Java compiles Ruffle's playerglobal ActionScript at build time;
          # ImageMagick turns the app's .ico into the menu entry's PNG; file
          # is used by appimagetool.
          apt-get install -y --no-install-recommends default-jre-headless \
            pkg-config libasound2-dev libudev-dev libfontconfig1-dev g++ imagemagick file
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 10.0 --install-dir "$HOME/.dotnet" --no-path
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Fetch Ruffle
        run: |
          set -eu
          ref="$(tr -d ' \r\n' < docker/ruffle-windows.ref)"
          git init -q ruffle
          git -C ruffle fetch -q --depth 1 https://gitea.jenangmaker.cloud/jenangmaker/ruffle.git "$ref"
          git -C ruffle checkout -q FETCH_HEAD
          git -C ruffle log --oneline -1

      - name: Cache cargo
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ruffle/target
          key: linux-ruffle-${{ hashFiles('ruffle/Cargo.lock') }}

      - name: Build Ruffle for Linux
        run: |
          set -eu
          cd ruffle
          # Sources newer than the restored cache, or cargo may take an
          # earlier pin's cached build as up to date (see windows-release.yml).
          find . -path ./target -prune -o -path ./.git -prune -o -type f -exec touch {} +
          cargo build --release -p ruffle_desktop --no-default-features \
            --features software_video,external_video,lzma,fontconfig-dlopen,rustls-tls
          ls -la target/release/ruffle_desktop
          echo "Linked libraries:"; ldd target/release/ruffle_desktop
          if ldd target/release/ruffle_desktop | grep -q libssl; then echo "linked to OpenSSL"; exit 1; fi
          newest="$(objdump -T target/release/ruffle_desktop | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
          echo "Newest glibc symbol: $newest"
          # Ubuntu 22.04's glibc is 2.35: nothing newer, or the player no longer starts there.
          if [ "$(printf '%s\nGLIBC_2.35\n' "$newest" | sort -V | tail -1)" != "GLIBC_2.35" ]; then
            echo "the player needs $newest, newer than Ubuntu 22.04's GLIBC_2.35"; exit 1
          fi

      - name: Publish Skua for Linux
        run: |
          set -eu
          dotnet publish Skua.App.Avalonia/Skua.App.Avalonia.csproj -c Release -r linux-x64 \
            --self-contained true -p:WarningLevel=0 -o out/VibeSkua
          test -f out/VibeSkua/Skua.App.Avalonia

      - name: Package tar.gz
        run: |
          set -eu
          cp Skua.AS3/skua/bin/skua.swf out/VibeSkua/
          install -D -m 755 ruffle/target/release/ruffle_desktop out/VibeSkua/ruffle/ruffle_desktop
          cp docs/linux-client.txt out/VibeSkua/README.txt
          install -m 755 docs/linux-install-desktop-entry.sh out/VibeSkua/install-desktop-entry.sh
          # The .ico's largest picture as the menu entry's icon.
          mkdir -p /tmp/icon
          convert Skua.App.Avalonia/Assets/SkuaIcon.ico /tmp/icon/i.png
          cp "$(ls -S /tmp/icon/*.png | head -1)" out/VibeSkua/vibeskua.png
          # The launcher only under the names people start: VibeSkua, and
          # VibeSkua Manager (the app opens its Manager when named so).
          cp out/VibeSkua/Skua.App.Avalonia "out/VibeSkua/VibeSkua Manager"
          mv out/VibeSkua/Skua.App.Avalonia out/VibeSkua/VibeSkua
          chmod 755 out/VibeSkua/VibeSkua "out/VibeSkua/VibeSkua Manager"
          mkdir -p dist
          tar -C out -czf "dist/VibeSkua-linux-x64-${{ steps.ver.outputs.version }}.tar.gz" VibeSkua

      - name: Package AppImage
        run: |
          set -eu
          app=/tmp/VibeSkua.AppDir
          mkdir -p "$app"
          cp -a out/VibeSkua "$app/VibeSkua"
          rm -f "$app/VibeSkua/VibeSkua Manager" "$app/VibeSkua/install-desktop-entry.sh"
          install -m 755 docs/linux-AppRun.sh "$app/AppRun"
          cp out/VibeSkua/vibeskua.png "$app/vibeskua.png"
          ln -s vibeskua.png "$app/.DirIcon"
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=VibeSkua' \
            'Comment=AQW bot client' 'Exec=VibeSkua' 'Icon=vibeskua' 'Categories=Game;' \
            'Terminal=false' 'Actions=Manager;' '' '[Desktop Action Manager]' \
            'Name=VibeSkua Manager' 'Exec=VibeSkua --manager' > "$app/vibeskua.desktop"
          curl -sSfL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod 755 /tmp/appimagetool
          # No FUSE in the build container: the tool runs from its extracted self.
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 /tmp/appimagetool --no-appstream "$app" \
            "dist/VibeSkua-linux-x64-${{ steps.ver.outputs.version }}.AppImage"
          ls -la dist

      - name: Publish Gitea release
        uses: https://gitea.com/actions/gitea-release-action@main
        with:
          token: ${{ secrets.GITEA_TOKEN }}
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          title: VibeSkua for Linux ${{ steps.ver.outputs.version }} (test)
          draft: ${{ inputs.draft || 'true' }}
          files: dist/*
          body: |
            VibeSkua for Linux (x86-64; Ubuntu 22.04, Debian 12, Fedora 35 or newer), test build: the Avalonia client with each
            tab's game in Ruffle's desktop player (no Flash, no browser), from branch windows
            at ${{ github.sha }}.

            `tar xzf` the archive and run `./VibeSkua`, or `./VibeSkua Manager` to start saved
            accounts as tabs; `./install-desktop-entry.sh` adds both to the applications menu.
            See README.txt inside.

            Or the AppImage: `chmod +x` it and run it; `--manager` (or "Manager" in its file
            name) opens the Manager.
