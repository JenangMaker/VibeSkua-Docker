# Runs the Ruffle bridge test (docs/ruffle-test) on Gitea Actions.
#
# Deliberately NOT on push: it fetches the live AQW client from game.aq.com on
# every run, so it is manual plus a weekly schedule. Its job is to catch the
# day Ruffle or AQW changes in a way that breaks the bridge — not to gate
# commits.
#
# Exits non-zero if the bridge regresses (callbacks != 28/28, or the game SWF
# stops loading). See docs/ruffle-test/README.md.

name: Ruffle bridge test

on:
  workflow_dispatch:
  schedule:
    # Mondays 04:00 UTC
    - cron: "0 4 * * 1"

jobs:
  bridge:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chrome runtime libraries
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates fonts-liberation libasound2 libatk-bridge2.0-0 \
            libatk1.0-0 libcairo2 libcups2 libdbus-1-3 libdrm2 libexpat1 \
            libgbm1 libglib2.0-0 libnspr4 libnss3 libpango-1.0-0 libx11-6 \
            libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 \
            libxkbcommon0 libxrandr2
          rm -rf /var/lib/apt/lists/*

      - name: Install harness deps
        working-directory: docs/ruffle-test
        run: npm install --omit=dev --no-audit --no-fund

      - name: Stage Ruffle + skua.swf
        working-directory: docs/ruffle-test
        run: npm run setup

      - name: Run bridge test
        working-directory: docs/ruffle-test
        env:
          RUN_SECONDS: "90"
        run: npm run test:headless

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ruffle-bridge-report
          path: docs/ruffle-test/report.txt
          retention-days: 30
