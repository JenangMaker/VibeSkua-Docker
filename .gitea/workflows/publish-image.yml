# Builds the VibeSkua Web image and pushes it to this Gitea's container
# registry.
#
#   gitea.jenangmaker.cloud/jenangmaker/vibeskua-web:avalonia-ui
#
# On the avalonia-ui branch (Skua with its Avalonia UI) the tag defaults to
# avalonia-ui, so by default it does not replace :latest, which the base branch
# (docker-and-ruffle-test, Skua headless) publishes.
#
# Every push builds and publishes too, tagged with the branch's name
# (vibeskua-web:optimize for the optimize branch, "/" made "-"), so a branch
# can be tried on a Komodo stack by pointing it at that tag. Pushes that only
# change documentation or the manager are skipped; a newer push to the same
# branch cancels the build still running for it.
#
# Requires the act_runner to expose a Docker daemon to jobs. If it does not,
# the "Check Docker access" step fails early with a clear message rather than
# dying somewhere inside buildx.
#
# The registry push needs a token with write:package. GITEA_TOKEN is injected
# automatically by Gitea Actions; if your instance scopes it down, add a PAT as
# a repo secret and swap it in below.

name: Publish image

on:
  push:
    branches: ["**"]
    # A push that changes only these (or nothing: an empty commit) does not
    # build. To build again without a change, use Run workflow (workflow_dispatch).
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "manager/**"
      - ".github/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: avalonia-ui)"
        required: false
        default: "avalonia-ui"
      push:
        description: "Push to the registry, or build only"
        required: false
        default: "true"
      dockerfile:
        description: "Dockerfile (default: docker/Dockerfile.native on native, native-*, *-native and ui-v2-* (native-based) branches, else docker/Dockerfile.kasm)"
        required: false
        default: ""

concurrency:
  group: publish-image-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      # A manual run's tag, else the branch's name.
      TAG: ${{ inputs.tag || github.ref_name }}
      PUSH: ${{ inputs.push || 'true' }}
      DOCKERFILE: ${{ inputs.dockerfile || ((startsWith(github.ref_name, 'native') || endsWith(github.ref_name, '-native') || startsWith(github.ref_name, 'ui-v2')) && 'docker/Dockerfile.native' || 'docker/Dockerfile.kasm') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker access
        run: |
          set -eu
          if ! command -v docker >/dev/null 2>&1; then
            echo "No docker CLI on this runner."
            echo "The act_runner must mount the Docker socket into jobs for this to work."
            exit 1
          fi
          docker version
          docker buildx version || echo "buildx unavailable - falling back to classic build"

      - name: Login to Gitea Package Repo
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.PACKAGE_URL }}
          username: ${{ vars.PACKAGE_USERNAME }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        run: |
          set -eu
          REGISTRY="${{ vars.PACKAGE_URL }}"
          IMAGE="${REGISTRY:-gitea.jenangmaker.cloud}/jenangmaker/vibeskua-web:$(echo "$TAG" | tr '/' '-')"
          echo "Building $IMAGE"
          # Repo variable RUFFLE_WEB_URL, if set, swaps in a custom Ruffle build
          # (a zip of web/packages/selfhosted/dist). Unset = official release.
          # The repo is private, so the download authenticates with the same
          # registry credentials used to push. Passed as a BuildKit secret so
          # the token never lands in an image layer or the build log.
          export RUFFLE_WEB_AUTH="${{ vars.PACKAGE_USERNAME }}:${{ secrets.PACKAGE_TOKEN }}"
          echo "Dockerfile: $DOCKERFILE"
          docker build -f "$DOCKERFILE" \
            --build-arg RUFFLE_WEB_URL="${{ vars.RUFFLE_WEB_URL }}" \
            --secret id=ruffle_web_auth,env=RUFFLE_WEB_AUTH \
            -t "$IMAGE" .
          docker image inspect "$IMAGE" --format 'built {{.Id}} ({{.Size}} bytes)'

      - name: Push image
        if: ${{ env.PUSH == 'true' }}
        run: |
          set -eu
          REGISTRY="${{ vars.PACKAGE_URL }}"
          IMAGE="${REGISTRY:-gitea.jenangmaker.cloud}/jenangmaker/vibeskua-web:$(echo "$TAG" | tr '/' '-')"
          docker push "$IMAGE"
          echo "Pushed $IMAGE"

      # The runner builds with the host's Docker (its socket is mounted), so every image built
      # here stayed on the server's system disk after the push, and each rebuild of a tag left
      # the previous one untagged: tens of GB within weeks. The registry keeps the pushed copy.
      # Runs even when a step failed; cleanup errors never fail the job.
      - name: Clean up the runner host
        if: ${{ always() }}
        run: |
          REGISTRY="${{ vars.PACKAGE_URL }}"
          IMAGE="${REGISTRY:-gitea.jenangmaker.cloud}/jenangmaker/vibeskua-web:$(echo "$TAG" | tr '/' '-')"
          docker image rm "$IMAGE" || true
          docker image prune -f || true
          # setup-buildx makes its own builder current; the host's cache is in "default".
          docker builder prune -f --builder default --filter until=72h || true
          docker builder prune -f --filter until=72h || true
          docker system df || true
