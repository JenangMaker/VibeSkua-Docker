# Builds the VibeSkua Web image and pushes it to this Gitea's container
# registry.
#
#   gitea.jenangmaker.cloud/jenangmaker/vibeskua-web:selkies
#
# This is the selkies-base branch: the Selkies edition, built from
# docker/Dockerfile.selkies and tagged :selkies unless the run says otherwise
# (the KasmVNC edition is built from the avalonia-ui branch).
#
# Requires the act_runner to expose a Docker daemon to jobs. If it does not,
# the "Check Docker access" step fails early with a clear message rather than
# dying somewhere inside buildx.
#
# The registry push needs a token with write:package. GITEA_TOKEN is injected
# automatically by Gitea Actions; if your instance scopes it down, add a PAT as
# a repo secret and swap it in below.

name: Publish image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: selkies)"
        required: false
        default: "selkies"
      push:
        description: "Push to the registry, or build only"
        required: false
        default: "true"
      dockerfile:
        description: "Dockerfile (docker/Dockerfile.kasm, or docker/Dockerfile.selkies)"
        required: false
        default: "docker/Dockerfile.selkies"

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker access
        run: |
          set -eu
          if ! command -v docker >/dev/null 2>&1; then
            echo "No docker CLI on this runner."
            echo "The act_runner must mount the Docker socket into jobs for this to work."
            exit 1
          fi
          docker version
          docker buildx version || echo "buildx unavailable - falling back to classic build"

      - name: Login to Gitea Package Repo
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.PACKAGE_URL }}
          username: ${{ vars.PACKAGE_USERNAME }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        run: |
          set -eu
          REGISTRY="${{ vars.PACKAGE_URL }}"
          IMAGE="${REGISTRY:-gitea.jenangmaker.cloud}/jenangmaker/vibeskua-web:${{ inputs.tag }}"
          echo "Building $IMAGE"
          # Repo variable RUFFLE_WEB_URL, if set, swaps in a custom Ruffle build
          # (a zip of web/packages/selfhosted/dist). Unset = official release.
          # The repo is private, so the download authenticates with the same
          # registry credentials used to push. Passed as a BuildKit secret so
          # the token never lands in an image layer or the build log.
          export RUFFLE_WEB_AUTH="${{ vars.PACKAGE_USERNAME }}:${{ secrets.PACKAGE_TOKEN }}"
          docker build -f "${{ inputs.dockerfile || 'docker/Dockerfile.selkies' }}" \
            --build-arg RUFFLE_WEB_URL="${{ vars.RUFFLE_WEB_URL }}" \
            --secret id=ruffle_web_auth,env=RUFFLE_WEB_AUTH \
            -t "$IMAGE" .
          docker image inspect "$IMAGE" --format 'built {{.Id}} ({{.Size}} bytes)'

      - name: Push image
        if: ${{ inputs.push == 'true' }}
        run: |
          set -eu
          REGISTRY="${{ vars.PACKAGE_URL }}"
          IMAGE="${REGISTRY:-gitea.jenangmaker.cloud}/jenangmaker/vibeskua-web:${{ inputs.tag }}"
          docker push "$IMAGE"
          echo "Pushed $IMAGE"
