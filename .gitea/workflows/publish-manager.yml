# Builds the VibeSkua Manager image (manager/Dockerfile) and pushes it to
# this Gitea's container registry:
#
#   gitea.jenangmaker.cloud/jenangmaker/vibeskua-manager:<tag>
#
# A small Node image with no dependencies; it needs nothing from the rest of
# the repository. How to run it: manager/README.md.
#
# Same runner and registry setup as publish-image.yml.
#
# A push that changes manager/ builds and pushes the image tagged with its
# branch (web-manager -> :web-manager); Run workflow takes a tag (latest).

name: Publish manager image

on:
  push:
    branches: ["**"]
    paths:
      - "manager/**"
      - ".gitea/workflows/publish-manager.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest)"
        required: false
        default: "latest"
      push:
        description: "Push to the registry, or build only"
        required: false
        default: "true"

concurrency:
  group: publish-manager-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      # A push has no inputs: its branch is the tag, and it pushes.
      TAG: ${{ inputs.tag || github.ref_name }}
      PUSH: ${{ inputs.push || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Gitea Package Repo
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.PACKAGE_URL }}
          username: ${{ vars.PACKAGE_USERNAME }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build image
        run: |
          set -eu
          REGISTRY="${{ vars.PACKAGE_URL }}"
          IMAGE="${REGISTRY:-gitea.jenangmaker.cloud}/jenangmaker/vibeskua-manager:${TAG}"
          echo "Building $IMAGE"
          docker build -t "$IMAGE" manager
          docker image inspect "$IMAGE" --format 'built {{.Id}} ({{.Size}} bytes)'

      - name: Push image
        if: ${{ env.PUSH == 'true' }}
        run: |
          set -eu
          REGISTRY="${{ vars.PACKAGE_URL }}"
          IMAGE="${REGISTRY:-gitea.jenangmaker.cloud}/jenangmaker/vibeskua-manager:${TAG}"
          docker push "$IMAGE"
          echo "Pushed $IMAGE"
