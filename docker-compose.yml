# VibeSkua containers, for developing VibeSkua. To just RUN it, use
# docker-compose.minimal.yml and DOCKER.md.
#
# vibeskua-web is VibeSkua itself in a browser (Linux, Ruffle, Skua's
# Avalonia UI); every setting is listed below and in DOCKER.md.
#
# The build services build the Windows client (WPF + Flash ActiveX), which
# only runs on a Windows desktop. See docs/BUILD-DOCKER.md.
#
#   docker compose run --rm build            # Linux host / Docker Desktop (WSL2)
#   docker compose run --rm build-windows    # Windows container host
#   docker compose run --rm package-windows  # + Velopack installer output
#
# Each build service drops its output into ./Build (and ./Releases) on the host.
#
# ruffle-test is different: it RUNS the Skua bridge headless on Linux, against
# the live AQW client, using Ruffle instead of Flash. Exits 0/1 for CI.
#
#   docker compose run --rm ruffle-test

services:
  # Cross-compiles the Windows binaries from a Linux container.
  # Works on any Docker host, including Docker Desktop on Windows Home.
  build:
    build:
      context: .
      dockerfile: docker/Dockerfile.linux
      target: copy
      args:
        SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0
    image: vibeskua-build:linux
    volumes:
      - ./Build:/out/Build

  # Toolchain-exact build. Needs a Windows container host.
  build-windows:
    build:
      context: .
      dockerfile: docker/Dockerfile.windows
      target: export
      args:
        SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0-windowsservercore-ltsc2022
        EXPORT_IMAGE: mcr.microsoft.com/windows/servercore:ltsc2022
    image: vibeskua-build:windows
    volumes:
      - type: bind
        source: ./Build
        target: C:\out\Build

  # Toolchain-exact build plus `vpk pack`. Needs a Windows container host.
  package-windows:
    build:
      context: .
      dockerfile: docker/Dockerfile.windows
      target: export-package
      args:
        SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0-windowsservercore-ltsc2022
        EXPORT_IMAGE: mcr.microsoft.com/windows/servercore:ltsc2022
        # VERSION: "1.8.5"   # defaults to <Version> in Directory.Build.props
    image: vibeskua-package:windows
    volumes:
      - type: bind
        source: ./Build
        target: C:\out\Build
      - type: bind
        source: ./Releases
        target: C:\out\Releases

  # Runs the Ruffle bridge test headless. No Windows, no desktop, no Flash.
  # Credentials are optional and passed at RUN time only, never baked in:
  #   docker compose run --rm -e AQW_USER=alt -e AQW_PASS=... ruffle-test
  ruffle-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.ruffle-test
      args:
        NODE_IMAGE: node:22-bookworm-slim
    image: vibeskua-ruffle-test:latest
    environment:
      RUN_SECONDS: "90"
    # Chrome needs more than the default 64MB of shared memory.
    shm_size: 1gb

  # VibeSkua in a browser at :3000: Skua's UI with the game (AQW on Ruffle)
  # embedded, one tab per account. Same pattern as linuxserver/chrome.
  # Port 3000 is all it needs. See DOCKER.md.
  vibeskua-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.kasm
    # avalonia-ui branch: Skua with its UI. :latest is the headless base.
    image: gitea.jenangmaker.cloud/jenangmaker/vibeskua-web:avalonia-ui
    ports:
      - "3000:3000"
      # With REMOTE_DEBUG_PORT below. Bind to the host's LAN IP, not 0.0.0.0.
      # - "192.168.2.20:9222:9222"
    environment:
      CUSTOM_USER: vibeskua
      PASSWORD: changeme
      TITLE: VibeSkua Web
      # Skua modules switched off after the game loads. Both of these read
      # game.ui.ModalStack without guarding game.ui, so each throws an uncaught
      # AVM2 error ~30x/sec whenever no UI is up.
      DISABLE_MODULES: QuestRequirementWiki,QuestItemRates
      # Skua's own performance modules, off by default because they change what
      # you see. DisableFX,HidePlayers is the biggest in-game CPU lever.
      ENABLE_MODULES: ""
      # Software rasterisation charges anti-aliasing to the CPU. low|medium|high
      RUFFLE_QUALITY: low
      # The next three need the patched Ruffle (RUFFLE_WEB_URL build arg); the
      # official release ignores them. All can also be changed from the control
      # bar under the game.
      #
      # webgl: ~36 fps at Max in a 10-player Battleon (Intel GPU). wgpu-webgl
      # has full visuals but manages ~2 fps there (wgpu-core overhead). webgl
      # gaps: no skill-cooldown darkening or aura fades. See web/TESTING.md.
      RUFFLE_RENDERER: webgl
      RENDER_SCALE: "1"
      # "1": show the render controls and the log under the game.
      # SHOW_DEBUG_PANEL: "0"
      # Frames drawn per second (with a GPU the game runs at full speed
      # regardless; without one, drawing holds it up in busy maps).
      # 0 = headless (nothing drawn). Infinity = unlimited. Default:
      # unlimited with a GPU (/dev/dri), 15 without.
      # MAX_RENDER_FPS: "Infinity"
      # Chrome DevTools Protocol for remote testing (Puppeteer). NO AUTH:
      # whoever reaches it controls the session. Uncomment together with the
      # port mapping below, bound to the host's LAN IP -- see web/README.md.
      # REMOTE_DEBUG_PORT: "9222"
      # Extra Chromium switches, space-separated, for GPU experiments.
      # (The glXGetMscRateOML log spam is filtered in /app/launch.sh.)
      # CHROMIUM_FLAGS: ""
      # Auto-login (as Skua does), again after a disconnect or a recycle, one
      # tab per account: AQW_USER_<N> / AQW_PASS_<N> (/ AQW_SERVER_<N>) for
      # tab N; plain AQW_USER / AQW_PASS also work for tab 1. Give passwords
      # as secrets (Komodo secret / env file), not inline.
      # AQW_USER_1: ""
      # AQW_PASS_1: ""
      # AQW_USER_2: ""
      # AQW_PASS_2: ""
      # AQW_SERVER: "Twilly"          # every tab's; first online server if unset
      # Reload the client when either is reached, out of combat, then log back
      # in and return to the same map. Ruffle keeps every SWF it loads for the
      # whole session (~45 MB per room change), so long sessions need this.
      # Needs AQW_USER/AQW_PASS.
      # RECYCLE_AFTER_MINUTES: "120"
      # RECYCLE_AFTER_MAP_CHANGES: "60"
      # Skua itself (Skua.App.Avalonia): the page connects to it and it drives
      # the game; its windows (main menu, bot window, options, ...) open on
      # this desktop. SKUA_UI: "0" runs it without windows. Scripts can also
      # start through its control API, which has NO AUTH (it runs code as the
      # bot) and listens inside the container only:
      #   docker exec vibeskua-web curl -s localhost:8791/status
      # See Skua.App.Avalonia/README.md and Skua.Host/README.md.
      # SKUA_HOST: "1"                 # "0": the game only, no Skua
      # SKUA_UI: "1"
      # The game is embedded in Skua's main window under its menu, as in the
      # Windows app; "0" keeps them separate (Skua a bar above the game).
      # SKUA_EMBED_GAME: "1"
      # Tabs, as in the Windows VibeSkua: one AQW account per tab (each its
      # own Skua and game), Army Control (every tab at once) and Grid View.
      # A tab opens for each account above (AQW_USER_<N>); "0" turns tabs off,
      # a number opens at least that many. Tab N's Skua listens on the
      # bridge/API ports + 10*(N-1) inside the container (tab 2: API 8801).
      # Each tab costs about as much memory and CPU as the first.
      # SKUA_TABS: "1"
      # Script to load at startup (it shows in the Script Loader, ready to
      # start): a repository path (scripts are synced from SKUA_SCRIPTS_REPO
      # at startup) or an absolute path. Every tab loads it; SKUA_SCRIPT_<N>
      # overrides it for tab N ("none": no script).
      # SKUA_SCRIPT: "Farm/GoldFarm"
      # "1": also start it once logged in. Off by default: it only loads.
      # SKUA_SCRIPT_AUTO_START_<N> for tab N.
      # SKUA_SCRIPT_AUTO_START: "0"
      # Private room CoreBots scripts join, for every account (written into
      # their CoreBots Options at login). SKUA_ROOM_NUMBER_<N> for tab N.
      # SKUA_ROOM_NUMBER: "9721"
      # Script sync at startup: "auto" follows Skua's options (Auto Update
      # Scripts on: download silently; off: ask), "ask" always asks (Update
      # all / Only missing / Skip), "off" never syncs. A mounted Scripts folder
      # (see volumes below) is always asked about, since "Update all"
      # overwrites local changes to outdated scripts.
      # SKUA_SCRIPT_SYNC: "auto"
      # Where scripts sync from: a GitHub or Gitea repository and branch.
      # SKUA_SCRIPTS_REPO: "https://github.com/auqw/Scripts"
      # SKUA_SCRIPTS_BRANCH: "Skua"
      # More repositories, each into Scripts/<folder>: "folder=URL[#branch]",
      # ";" between several (or SKUA_SCRIPTS_EXTRA_1, _2, ...).
      # SKUA_SCRIPTS_EXTRA: "UltrasLW=https://github.com/l0newolf12/UltrasLW"
      # To reach the API from the LAN instead, add a LAN-IP port mapping
      # ("192.168.2.20:8791:8791") and:
      # SKUA_API_PREFIX: "http://+:8791/"
      # The tab host API: every tab, the resources and the accounts through
      # one port (what a remote manager uses). Map "192.168.2.20:8789:8789".
      # SKUA_HOST_API_PREFIX: "http://+:8789/"
      # Require this token (Authorization: Bearer <token>) on every control
      # API. Set it whenever an API is published.
      # SKUA_API_TOKEN: ""
    # Keep settings, CoreBots options, scripts and saved browser data across
    # updates: mount /config. A separate Scripts folder can go on top; Skua
    # asks before syncing it with the scripts repository. Both must be
    # writable by the container user (PUID/PGID).
    # volumes:
    #   - ./config:/config
    #   - /path/on/host/skua-scripts:/config/.config/Skua/Scripts
    # Chromium needs syscalls Docker's default seccomp profile blocks.
    security_opt:
      - seccomp=unconfined
    shm_size: 1gb
    restart: unless-stopped
    # Without a GPU, Ruffle renders through SwiftShader on the CPU, and a 30fps
    # Flash game in software will saturate whatever it is given. Cap it so the
    # host cannot thermal throttle.
    cpus: 2.0
    # Far better than capping: hand it the host's GPU, if there is one. The
    # LinuxServer base picks this up automatically.
    # devices:
    #   - /dev/dri:/dev/dri
