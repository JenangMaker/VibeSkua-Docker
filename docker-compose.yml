# VibeSkua containers.
#
# The build services BUILD VibeSkua; they cannot run it (WPF + Flash ActiveX +
# process hooking need an interactive Windows desktop). See DOCKER.md.
#
#   docker compose run --rm build            # Linux host / Docker Desktop (WSL2)
#   docker compose run --rm build-windows    # Windows container host
#   docker compose run --rm package-windows  # + Velopack installer output
#
# Each build service drops its output into ./Build (and ./Releases) on the host.
#
# ruffle-test is different: it RUNS the Skua bridge headless on Linux, against
# the live AQW client, using Ruffle instead of Flash. Exits 0/1 for CI.
#
#   docker compose run --rm ruffle-test

services:
  # Cross-compiles the Windows binaries from a Linux container.
  # Works on any Docker host, including Docker Desktop on Windows Home.
  build:
    build:
      context: .
      dockerfile: docker/Dockerfile.linux
      target: copy
      args:
        SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0
    image: vibeskua-build:linux
    volumes:
      - ./Build:/out/Build

  # Toolchain-exact build. Needs a Windows container host.
  build-windows:
    build:
      context: .
      dockerfile: docker/Dockerfile.windows
      target: export
      args:
        SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0-windowsservercore-ltsc2022
        EXPORT_IMAGE: mcr.microsoft.com/windows/servercore:ltsc2022
    image: vibeskua-build:windows
    volumes:
      - type: bind
        source: ./Build
        target: C:\out\Build

  # Toolchain-exact build plus `vpk pack`. Needs a Windows container host.
  package-windows:
    build:
      context: .
      dockerfile: docker/Dockerfile.windows
      target: export-package
      args:
        SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0-windowsservercore-ltsc2022
        EXPORT_IMAGE: mcr.microsoft.com/windows/servercore:ltsc2022
        # VERSION: "1.8.5"   # defaults to <Version> in Directory.Build.props
    image: vibeskua-package:windows
    volumes:
      - type: bind
        source: ./Build
        target: C:\out\Build
      - type: bind
        source: ./Releases
        target: C:\out\Releases

  # Runs the Ruffle bridge test headless. No Windows, no desktop, no Flash.
  # Credentials are optional and passed at RUN time only, never baked in:
  #   docker compose run --rm -e AQW_USER=alt -e AQW_PASS=... ruffle-test
  ruffle-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.ruffle-test
      args:
        NODE_IMAGE: node:22-bookworm-slim
    image: vibeskua-ruffle-test:latest
    environment:
      RUN_SECONDS: "90"
    # Chrome needs more than the default 64MB of shared memory.
    shm_size: 1gb

  # AQW on Ruffle with the Skua bridge, reachable in a browser at :3000.
  # Same pattern as linuxserver/chrome. NOT the bot - see web/README.md.
  vibeskua-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.kasm
    image: gitea.jenangmaker.cloud/jenangmaker/vibeskua-web:latest
    ports:
      - "3000:3000"
      # With REMOTE_DEBUG_PORT below. Bind to the host's LAN IP, not 0.0.0.0.
      # - "192.168.2.20:9222:9222"
    environment:
      CUSTOM_USER: vibeskua
      PASSWORD: changeme
      TITLE: VibeSkua Web
      # Skua modules switched off after the game loads. Both of these read
      # game.ui.ModalStack without guarding game.ui, so each throws an uncaught
      # AVM2 error ~30x/sec whenever no UI is up.
      DISABLE_MODULES: QuestRequirementWiki,QuestItemRates
      # Skua's own performance modules, off by default because they change what
      # you see. DisableFX,HidePlayers is the biggest in-game CPU lever.
      ENABLE_MODULES: ""
      # Software rasterisation charges anti-aliasing to the CPU. low|medium|high
      RUFFLE_QUALITY: low
      # The next three need the patched Ruffle (RUFFLE_WEB_URL build arg); the
      # official release ignores them. All can also be changed from the control
      # bar under the game.
      #
      # Tested in-game: wgpu-webgl loads fully at Max and at a 15 fps cap
      # (MAX_RENDER_FPS: "15" is the tested lower-CPU option). webgl broke
      # room setup -- see web/README.md -- so leave it off for now.
      RUFFLE_RENDERER: wgpu-webgl
      RENDER_SCALE: "1"
      # Frames drawn per second. The game always runs at full speed.
      # 0 = headless (nothing drawn). Infinity = unlimited.
      MAX_RENDER_FPS: "Infinity"
      # Chrome DevTools Protocol for remote testing (Puppeteer). NO AUTH:
      # whoever reaches it controls the session. Uncomment together with the
      # port mapping below, bound to the host's LAN IP -- see web/README.md.
      # REMOTE_DEBUG_PORT: "9222"
      # Extra Chromium switches, space-separated. With a GPU passed in, the
      # default GLX path logs "glXGetMscRateOML failed" ~35x/s under KasmVNC;
      # "--use-angle=gl-egl" is the first thing to try.
      # CHROMIUM_FLAGS: ""
    # Chromium needs syscalls Docker's default seccomp profile blocks.
    security_opt:
      - seccomp=unconfined
    shm_size: 1gb
    restart: unless-stopped
    # Without a GPU, Ruffle renders through SwiftShader on the CPU, and a 30fps
    # Flash game in software will saturate whatever it is given. Cap it so the
    # host cannot thermal throttle.
    cpus: 2.0
    # Far better than capping: hand it the host's GPU, if there is one. The
    # LinuxServer base picks this up automatically.
    # devices:
    #   - /dev/dri:/dev/dri
