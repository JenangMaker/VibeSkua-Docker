<!doctype html>
<meta charset="utf-8">
<title>VibeSkua Web</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #ddd; font: 13px/1.5 system-ui, sans-serif; }
  #stage { display: flex; justify-content: center; background: #000; }
  #status { padding: 6px 10px; font-family: ui-monospace, monospace; font-size: 12px;
            border-top: 1px solid #333; max-height: 9em; overflow-y: auto; }
  .err { color: #ff8a80; }
  .ok  { color: #9ae6a0; }
  #controls { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center;
              padding: 6px 10px; border-top: 1px solid #333; font-size: 12px; }
  #controls .group { display: flex; gap: 3px; align-items: center; }
  #controls button { background: #222; color: #ccc; border: 1px solid #444; border-radius: 3px;
                     padding: 2px 8px; font: inherit; cursor: pointer; }
  #controls button.on { background: #2d5a8c; color: #fff; border-color: #3d7ac0; }
  #controls .note { color: #888; }
</style>
<div id="stage"></div>
<div id="controls" hidden>
  <div class="group">Draw:
    <button data-fps="0" title="Headless: nothing is drawn, the game keeps running">Off</button>
    <button data-fps="5">5</button>
    <button data-fps="15">15</button>
    <button data-fps="30">30</button>
    <button data-fps="Infinity">Max</button> fps
  </div>
  <div class="group">Renderer:
    <button data-renderer="wgpu-webgl" title="Full visuals (filters, glows). Reloads the page.">wgpu</button>
    <button data-renderer="webgl" title="Lighter, but no filters and less complete. Reloads the page.">webgl</button>
  </div>
  <div class="group">Resolution:
    <button data-scale="0.5">50%</button>
    <button data-scale="0.75">75%</button>
    <button data-scale="1">100%</button>
  </div>
  <span class="note" id="controls-note"></span>
</div>
<div id="status"></div>

<script>
  // Which of Skua's tabs (accounts) this page is: main.js opens one page per
  // tab, ?instance=N, each with its own bridge port and credentials.
  window.VIBESKUA_INSTANCE = new URLSearchParams(location.search).get('instance') || '0';
</script>
<script src="/ruffle/ruffle.js"></script>
<script src="/session.js"></script>
<script src="/skua-bridge.js"></script>
<script>
const statusEl = document.getElementById('status');
function say(msg, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  statusEl.appendChild(d);
  statusEl.scrollTop = statusEl.scrollHeight;
  console.log(msg);
}

// --- JS side of the Skua bridge (see Skua.AS3 Externalizer.as) ---
let player = null;
window.debug = m => { say('swf: ' + m); return true; };
window.requestLoadGame = () => {
  say('bridge up - loading game client');
  // skua.swf registers its callbacks then asks the host to start the load.
  setTimeout(() => { try { player.loadClient(); } catch (e) { say('loadClient failed: ' + e, 'err'); } }, 0);
  return true;
};
window['pre-load'] = () => true;

// Ruffle cannot open raw TCP. Every (host, port) the SWF dials has to be
// declared here and routed through the local WebSocket bridge. Port 843 is
// Flash's cross-domain policy port and is registered for each host too.
function buildSocketProxy(servers, proxyPort) {
  const seen = new Set();
  const out = [];
  const add = (host, port) => {
    const key = host + ':' + port;
    if (seen.has(key)) return;
    seen.add(key);
    out.push({
      host,
      port,
      proxyUrl: `ws://127.0.0.1:${proxyPort}/${encodeURIComponent(host)}/${port}`,
    });
  };
  for (const s of servers) {
    if (!s.sIP || !s.iPort) continue;
    add(s.sIP, Number(s.iPort));
    add(s.sIP, 843);
  }
  return out;
}

// Resolves true once the game SWF has loaded (params.sURL is set), false if it
// never does within ~60s.
async function waitForGame() {
  for (let i = 0; i < 40; i++) {
    await new Promise(r => setTimeout(r, 1500));
    try { if (player.getGameObject('params.sURL') != null) return true; } catch (e) {}
  }
  return false;
}

// Modules.disable() is a no-op until Modules.init() has run, which happens in
// Main.as onComplete -- i.e. only after the game SWF loads. Wait for that,
// then apply once.
async function applyModules(disable, enable) {
  if (!disable.length && !enable.length) return;
  if (!await waitForGame()) {
    say('game never finished loading; modules left as-is', 'err');
    return;
  }
  for (const n of disable) {
    try { player.modDisable(n); say('disabled module: ' + n, 'ok'); }
    catch (e) { say('could not disable ' + n + ': ' + e, 'err'); }
  }
  for (const n of enable) {
    try { player.modEnable(n); say('enabled module: ' + n, 'ok'); }
    catch (e) { say('could not enable ' + n + ': ' + e, 'err'); }
  }
}

// --- Rendering controls (patched Ruffle only) -------------------------------
// The game keeps running at full speed whatever these are; they only decide
// how much gets drawn. With software rendering, drawing is nearly all the CPU.
function renderControlsSupported() {
  return player && 'maxRenderFps' in player && 'renderScale' in player;
}

function syncControls() {
  const fps = player.maxRenderFps, scale = player.renderScale;
  for (const b of document.querySelectorAll('#controls [data-fps]')) {
    b.classList.toggle('on', Number(b.dataset.fps) === fps);
  }
  for (const b of document.querySelectorAll('#controls [data-scale]')) {
    b.classList.toggle('on', Math.abs(Number(b.dataset.scale) - scale) < 0.01);
  }
  document.getElementById('controls-note').textContent =
    fps === 0 ? 'headless - game still running, picture frozen' : '';
}

// Also callable from outside, e.g. a bot toggling headless while it farms:
//   window.vibeskua.setRender({ fps: 0 })     // headless
//   window.vibeskua.setRender({ fps: 15, scale: 0.5 })
window.vibeskua = {
  setRender({ fps, scale } = {}) {
    if (!renderControlsSupported()) return false;
    if (fps !== undefined) player.maxRenderFps = fps === null ? Infinity : Number(fps);
    if (scale !== undefined) player.renderScale = Number(scale);
    syncControls();
    return true;
  },
  getRender() {
    return renderControlsSupported()
      ? { fps: player.maxRenderFps, scale: player.renderScale } : null;
  },
};

let currentRenderer = null;
function initControls(renderScale, maxRenderFps) {
  if (!renderControlsSupported()) {
    say('this Ruffle build has no render controls (need the aqw-loader-fixes build)', 'err');
    return;
  }
  window.vibeskua.setRender({ fps: maxRenderFps, scale: renderScale });
  const bar = document.getElementById('controls');
  bar.hidden = false;
  for (const b of bar.querySelectorAll('[data-renderer]')) {
    b.classList.toggle('on', b.dataset.renderer === currentRenderer);
  }
  bar.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.renderer !== undefined) {
      if (b.dataset.renderer === currentRenderer) return;
      const q = new URLSearchParams(location.search);
      q.set('renderer', b.dataset.renderer);
      location.search = q.toString();   // reload; Ruffle picks its renderer at startup
      return;
    }
    if (b.dataset.fps !== undefined) window.vibeskua.setRender({ fps: Number(b.dataset.fps) });
    if (b.dataset.scale !== undefined) window.vibeskua.setRender({ scale: Number(b.dataset.scale) });
  });
  const f = player.maxRenderFps;
  say(`render: ${player.renderScale * 100}% resolution, ` +
      (f === 0 ? 'headless' : f === Infinity ? 'unlimited fps' : `max ${f} fps`), 'ok');
}

async function main() {
  let servers = [], proxyPort = 8181, disableModules = [], enableModules = [], quality = 'low';
  let renderer = 'wgpu-webgl', renderScale = 1, maxRenderFps = Infinity;
  let sessionCfg = {}, skuaBridgeUrl = null;
  try {
    const r = await (await fetch('/servers?instance=' + window.VIBESKUA_INSTANCE)).json();
    servers = r.servers || [];
    proxyPort = r.proxyPort || proxyPort;
    disableModules = r.disableModules || [];
    enableModules = r.enableModules || [];
    quality = r.quality || quality;
    renderer = r.renderer || renderer;
    renderScale = r.renderScale ?? renderScale;
    maxRenderFps = r.maxRenderFps === null ? Infinity : (r.maxRenderFps ?? maxRenderFps);
    sessionCfg = {
      autoLogin: !!r.autoLogin,
      recycleAfterMinutes: r.recycleAfterMinutes || 0,
      recycleAfterMapChanges: r.recycleAfterMapChanges || 0,
    };
    skuaBridgeUrl = r.skuaBridgeUrl || null;
  } catch (e) {
    say('could not fetch server list: ' + e, 'err');
  }

  // URL overrides beat the container defaults, so a choice survives the reload
  // a renderer switch needs:  ?renderer=webgl&scale=0.75&fps=15  (fps=max ok)
  const qp = new URLSearchParams(location.search);
  if (qp.get('renderer')) renderer = qp.get('renderer');
  if (qp.has('scale')) renderScale = Number(qp.get('scale'));
  if (qp.has('fps')) maxRenderFps = qp.get('fps') === 'max' ? Infinity : Number(qp.get('fps'));

  const socketProxy = buildSocketProxy(servers, proxyPort);
  say(`${servers.length} servers, ${socketProxy.length} socketProxy entries`);
  if (!socketProxy.length) say('no socket routes - login will not work', 'err');

  const ruffle = window.RufflePlayer.newest();
  player = ruffle.createPlayer();
  player.style.width = '958px';
  player.style.height = '550px';
  player.style.display = 'block';
  document.getElementById('stage').appendChild(player);

  // Skua.Host (SKUA_HOST=1): forward the SWF's calls to it and let it drive
  // the SWF. Installed before the load so requestLoadGame is forwarded too.
  if (skuaBridgeUrl) {
    window.skuaBridge.attach(player);
    window.skuaBridge.install();
    window.skuaBridge.connect(skuaBridgeUrl, say);
  }

  try {
    await player.load({
      url: '/skua.swf',
      allowScriptAccess: true,
      allowNetworking: 'all',
      autoplay: 'on',
      unmuteOverlay: 'hidden',
      contextMenu: 'off',
      splashScreen: false,
      logLevel: 'warn',
      quality,
      preferredRenderer: renderer,
      socketProxy,
    });
    say('skua.swf loaded', 'ok');
    say(`renderer: ${renderer}, quality: ${quality}`);
    currentRenderer = renderer;
    initControls(renderScale, maxRenderFps);
    applyModules(disableModules, enableModules);
    // Auto-login / re-login / recycling; see web/public/session.js.
    if (await waitForGame()) window.vibeskuaSession.start(sessionCfg, player, say);
  } catch (e) {
    say('failed to load skua.swf: ' + e, 'err');
  }
}
main();
</script>
