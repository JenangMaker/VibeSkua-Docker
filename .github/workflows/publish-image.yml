# Builds the VibeSkua Web image, native edition (docker/Dockerfile.native:
# Ruffle's desktop player with the Skua bridge, in place of Electron and the
# web player), and pushes it to the GitHub Container Registry as
# ghcr.io/<owner>/vibeskua-web. How to use the image: DOCKER.md.
#
#   Run it by hand (Actions > Publish image > Run workflow): tag "latest" by
#     default, or any tag you give.
#   Push a version tag (v2.3.4): the image gets :2.3.4, :2.3 and :latest.
#
# Ruffle is built from the fork's commit pinned in docker/ruffle-native.ref,
# so a run takes a while (the Rust build). The 1.x line (Electron, branch
# avalonia-ui) is built by that branch's own copy of this workflow.
#
# The first push creates the package as private: make it public once under
# your profile > Packages > vibeskua-web > Package settings.
#
# Gitea runs .gitea/workflows/publish-image.yml instead (it ignores
# .github/workflows once .gitea/workflows exists).

name: Publish image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: false
        default: "latest"
      push:
        description: "Push to the registry (false: build only)"
        type: boolean
        default: true
  push:
    tags: ["v*", "!v*-selkies"]   # v*-selkies: the Selkies image (branch selkies-base)

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vibeskua-web
          tags: |
            type=raw,value=${{ inputs.tag || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=VibeSkua Web
            org.opencontainers.image.description=VibeSkua (Skua + AQW on Ruffle's desktop player) in a browser: several accounts in tabs, Army Control, Grid View.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.native
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Ruffle: fork commit $(tr -d ' \r\n' < docker/ruffle-native.ref)"
          } >> "$GITHUB_STEP_SUMMARY"
