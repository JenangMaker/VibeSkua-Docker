# Builds the VibeSkua Web image (docker/Dockerfile.kasm) and pushes it to the
# GitHub Container Registry as ghcr.io/<owner>/vibeskua-web. How to use the
# image: DOCKER.md.
#
#   Run it by hand (Actions > Publish image > Run workflow): tag "latest" by
#     default, or any tag you give.
#   Push a version tag (v1.2.3): the image gets :1.2.3, :1.2 and :latest.
#
# Ruffle comes from the AQW Ruffle fork's GitHub release (its aqw.yml
# workflow publishes it): aqw-latest by default; set the repository variable
# RUFFLE_WEB_URL, or the run's input, for another build. Public, so no secret.
#
# The first push creates the package as private: make it public once under
# your profile > Packages > vibeskua-web > Package settings.
#
# Gitea runs .gitea/workflows/publish-image.yml instead (it ignores
# .github/workflows once .gitea/workflows exists).

name: Publish image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: false
        default: "latest"
      ruffle_web_url:
        description: "Ruffle web build zip (empty: the AQW Ruffle fork's aqw-latest release)"
        required: false
        default: ""
      push:
        description: "Push to the registry (false: build only)"
        type: boolean
        default: true
  push:
    tags: ["v*", "!v*-selkies"]   # v*-selkies: the Selkies image (branch selkies-base)

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DEFAULT_RUFFLE_WEB_URL: https://github.com/${{ github.repository_owner }}/ruffle/releases/download/aqw-latest/ruffle-aqw-selfhosted.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick the Ruffle build
        id: ruffle
        run: |
          set -eu
          URL="${{ inputs.ruffle_web_url }}"
          [ -n "$URL" ] || URL="${{ vars.RUFFLE_WEB_URL }}"
          [ -n "$URL" ] || URL="$DEFAULT_RUFFLE_WEB_URL"
          echo "Ruffle: $URL"
          # Fail here, clearly, rather than deep inside the image build.
          curl -fsSIL -o /dev/null "$URL" || { echo "Cannot download $URL (has the Ruffle fork's AQW build published a release yet?)"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vibeskua-web
          tags: |
            type=raw,value=${{ inputs.tag || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=VibeSkua Web
            org.opencontainers.image.description=VibeSkua (Skua + AQW on Ruffle) in a browser: several accounts in tabs, Army Control, Grid View.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.kasm
          build-args: |
            RUFFLE_WEB_URL=${{ steps.ruffle.outputs.url }}
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Ruffle: ${{ steps.ruffle.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
