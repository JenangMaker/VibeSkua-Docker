# Builds the VibeSkua Manager image (manager/Dockerfile) and pushes it to the
# GitHub Container Registry as ghcr.io/<owner>/vibeskua-manager. How to use
# it: manager/README.md.
#
#   Run it by hand (Actions > Publish manager image > Run workflow): tag
#     "latest" by default, or any tag you give.
#   Push a version tag (v1.2.3): the image gets :1.2.3, :1.2 and :latest, the
#     same versions as vibeskua-web, so matching tags work together.
#
# The first push creates the package as private: make it public once under
# your profile > Packages > vibeskua-manager > Package settings.

name: Publish manager image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: false
        default: "latest"
      push:
        description: "Push to the registry (false: build only)"
        type: boolean
        default: true
  push:
    tags: ["v*", "!v*-selkies"]   # v*-selkies: the Selkies image (branch selkies-base)

concurrency:
  group: publish-manager-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vibeskua-manager
          tags: |
            type=raw,value=${{ inputs.tag || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=VibeSkua Manager
            org.opencontainers.image.description=Web page to monitor and control a VibeSkua instance remotely: bots, Army Control, accounts, resources.

      # For the arm64 image (a Raspberry Pi and the like can run the manager).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: manager
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager

      - name: Summary
        run: |
          {
            echo "### Image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
